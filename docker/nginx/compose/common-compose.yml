services:

  nginx:

    image: "${NGINX_TAG}"
    hostname: "${NGINX_HOSTNAME:-nginx}"
    logging:
      options:
        max-size: "${NGINX_LOG_SIZE:-100M}"
    environment:
      TZ:                        "${TZ}"
    networks:
      - nginx_network
    ports:
      - "80:80"
      - "443:443"
      - "${GITLAB_SSH_PORT:-22155}:${GITLAB_SSH_PORT:-22155}"
      - "${DOCKER_REGISTRY_PORT:-5000}:${DOCKER_REGISTRY_PORT:-5000}"

networks:
  nginx_network:
    name: "${NGINX_NETWORK:-nginx_network}"
    external: true