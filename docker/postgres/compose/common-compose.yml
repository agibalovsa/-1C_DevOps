services:

  postgres:

    image: "${POSTGRES_TAG}"
    hostname: "${POSTGRES_HOSTNAME:-postgres}"
    command: postgres -c listen_addresses='*'
    environment:
      # https://hub.docker.com/_/postgres
      TZ: "${TZ}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    networks:
      - postgres_network
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # For postgres 1c: /var/lib/pgpro/1c-${POSTGRES_MAJOR}/data
      # For vanilla postgres: /var/lib/postgresql/data
      - "postgres_data:${POSTGRES_DATA_PATH}"
    secrets:
      - postgres_password

networks:
  postgres_network:
    name: "${POSTGRES_NETWORK:-postgres_network}"
    external: true

volumes:
  postgres_data:
    external: true
    name: "${POSTGRES_DATA_VOL:-postgres_data}"
